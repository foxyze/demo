name: test

on:
  workflow_call:
    inputs:
      coverage_threshold:
        type: number
        default: 0
    outputs:
      coverage:
        value: ${{ jobs.test.outputs.coverage }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build --no-restore

      - run: dotnet test --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage
        id: coverage
        run: |
          file=$(find TestResults -name coverage.cobertura.xml | head -1)
          rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$file" | cut -d'"' -f2)
          percent=$(awk "BEGIN { printf \"%.1f\", $rate * 100 }")
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          echo "Line coverage: $percent%" >> "$GITHUB_STEP_SUMMARY"

      - name: Check threshold
        if: inputs.coverage_threshold > 0
        env:
          PERCENT: ${{ steps.coverage.outputs.percent }}
          THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          if ! awk "BEGIN { exit !($PERCENT >= $THRESHOLD) }"; then
            echo "::error::Line coverage $PERCENT% is below $THRESHOLD%"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: application/TestResults/**/coverage.cobertura.xml
