name: qa

on:
  push:
    tags: ["QA-*"]

concurrency:
  group: qa
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Application changes since previous QA tag
        id: diff
        run: |
          prev=$(git tag --list 'QA-*' --merged "$GITHUB_SHA" --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [ -z "$prev" ] || ! git diff --quiet "$prev" "$GITHUB_SHA" -- application/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No application changes since $prev" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      coverage_threshold: 15

  quality:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet format --verify-no-changes
        working-directory: application
      - run: pipx run semgrep==1.182.0 scan --config p/csharp --error application/

  build:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish application/PiranhaDemo/PiranhaDemo.csproj -c Release -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ github.ref_name }}
          path: publish
          retention-days: 90

  release:
    needs: [test, quality, build]
    uses: ./.github/workflows/cd.yml
    with:
      tag: ${{ github.ref_name }}
      artifact: app-${{ github.ref_name }}
    secrets: inherit
